name: 'desiasymm'
file_config:
    base_dir: 'output/'
    data_dir: 'data_dir/'
    pics_dir: 'pics/'
    dic_name: 'calculations.pkl'
    # P_linear at desired z, stored with k in h/Mpc and P in Mpc^3/h^3
    linear_power_name: 'linear_power.txt'
    # P_nonlinear at desired z, stored with k in h/Mpc and P in Mpc^3/h^3
    nonlinear_power_name: 'nonlinear_power.txt'
    # M at desired z
    M_name: 'M.txt'
data_creation_config:
    npoints: 10000
    # Min k for P, M generation, in h/Mpc
    mink: 1e-7
    # Max k for P, M generation, in h/Mpc
    maxk: 1.
    z: 1.
    cosmology: 'Planck15'
survey_config:
    primordial_pars:
        fnl: 1.
    gravity_dynamics_pars:
        deltac: 1.42
        # a1 = 1 in spherical collapse
        a1: 1.
        # a2 = -17/21 in spherical collapse
        a2: -0.8095238095
    tracer_properties:
        mhalo: 0.773
        # Mean number density of sources, in (h/Mpc)^3
        nhalo: 3.3e-4
        biases: # if blank use a theory expression
            b10: 1.6
            b01: ''
            b11: ''
            b02: ''
            b20: -0.3
            bs2: ''
    geometry:
        # Survey volume in (Gpc/h)^3
        volume: 30.
analysis_config:
    mink_reconstruction: 0.051
    maxk_reconstruction: 0.15
    mink_analysis: 0.0005 #0.002
    maxk_analysis: 0.05
    specific_combs: ''
    # Example of specific combinations:
    # specific_combs: [['g'], ['g', 's', 't']]
    biases_definitions: {
      'g': 'b10+21/17*b20',
      's': 'b10',
      't': 'b10+7/2*bs2'
    }
    noise_prefix: 'N'
forecast_config:
    vegas_mode: True
    nitn: 10  # Number of iterations for Vegas
    neval: 1000  # Number of evaluations per iteration 